{% extends 'base.html' %}
{% block title %}Transfer - SecureBank AI{% endblock %}
{% block page_title %}Fund Transfer{% endblock %}
{% block content %}
<div class="row justify-content-center mt-3">
    <div class="col-md-6 col-lg-5">
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <h5 class="fw-bold mb-4"><i class="fas fa-exchange-alt text-primary me-2"></i>Transfer Funds</h5>
                <form method="POST">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
                    <div class="mb-3">
                        <label class="form-label">From Account</label>
                        <select name="from_account_id" class="form-select" required>
                            {% for acc in accounts %}
                            <option value="{{ acc.id }}">{{ acc.account_type.title() }} - {{ acc.account_number }} (₹{{ "{:,.2f}".format(acc.balance) }})</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Recipient Account Number</label>
                        <input type="text" name="to_account_number" class="form-control" placeholder="16-digit account number" maxlength="16" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Amount (₹)</label>
                        <input type="number" name="amount" class="form-control" min="1" step="0.01" placeholder="0.00" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Description</label>
                        <input type="text" name="description" class="form-control" placeholder="Fund Transfer" value="Fund Transfer">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="fas fa-paper-plane me-2"></i> Transfer
                    </button>
                    <a href="{{ url_for('dashboard.index') }}" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
