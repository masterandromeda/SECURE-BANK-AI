{% extends "base.html" %}
{% block title %}Login — Secure Bank{% endblock %}
{% block content %}
<div class="row justify-content-center mt-5">
  <div class="col-md-5 col-sm-10">
    <div class="card p-4">
      <div class="card-body">
        <h2 class="card-title text-center mb-4">🏦 Secure Bank Login</h2>
        <form action="{{ url_for('login') }}" method="POST" novalidate>
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold">Username</label>
            <input type="text" class="form-control" id="username" name="username" placeholder="Enter your username" autocomplete="username" required />
          </div>
          <div class="mb-4">
            <label for="password" class="form-label fw-semibold">Password</label>
            <input type="password" class="form-control" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required />
          </div>
          <div class="d-grid">
            <button type="submit" class="btn btn-primary btn-lg">Login</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
