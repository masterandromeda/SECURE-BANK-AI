{% extends "base.html" %}
{% block title %}Dashboard — Secure Bank{% endblock %}
{% block content %}
<div class="row justify-content-center mt-4">
  <div class="col-md-7 col-sm-12">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h2 class="mb-0">Welcome, {{ username }}!</h2>
      <form action="{{ url_for('logout') }}" method="POST" class="d-inline">
        <button type="submit" class="btn btn-danger">Logout</button>
      </form>
    </div>
    <div class="card mb-4">
      <div class="card-body text-center py-4">
        <p class="text-muted mb-1">Current Account Balance</p>
        <div class="balance-display">${{ "%.2f"|format(balance) }}</div>
      </div>
    </div>
    <div class="row g-3">
      <div class="col-6">
        <a href="{{ url_for('deposit_route') }}" class="btn btn-primary w-100 py-2">Deposit</a>
      </div>
      <div class="col-6">
        <a href="{{ url_for('withdraw_route') }}" class="btn btn-outline-primary w-100 py-2">Withdraw</a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
